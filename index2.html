<div class="v-c-cmp v-c-cmp--l">
    <style>
        #regional-dressup-widget * { box-sizing: border-box; }
        .dressup-container {
            --primary-color: #2c3e50; --highlight-color: #e74c3c; --bg-color: #f8f9fa;
            --border-radius: 8px; --ui-font: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            width: 100%; max-width: 1200px; margin: 0 auto; font-family: var(--ui-font);
            background: var(--bg-color); border: 1px solid #e1e4e8; border-radius: var(--border-radius);
            overflow: hidden; display: flex; flex-direction: column; user-select: none;
        }
        body.is-dressing-up, body.is-dressing-up * { cursor: grabbing !important; }
        .dressup-controls {
            display: flex; flex-wrap: wrap; gap: 15px; padding: 15px 20px;
            background: #fff; border-bottom: 1px solid #e1e4e8; align-items: center; justify-content: center; z-index: 10;
        }
        .dressup-controls .control-group { display: flex; align-items: center; gap: 8px; }
        .dressup-controls label { font-size: 0.9rem; font-weight: 600; color: var(--primary-color); }
        .dressup-controls select, .btn-reset { padding: 8px 12px; border: 1px solid #ccc; border-radius: 4px; font-size: 0.9rem; cursor: pointer; }
        .btn-reset { display: flex; align-items: center; gap: 6px; background: var(--primary-color); color: #fff; border: none; margin-left: auto; }
        .btn-reset:hover { background: #1a252f; }
        .dressup-stage { width: 100%; background: #eef1f5; padding: 0; }
        .stage-outer { position: relative; width: 100%; overflow: hidden; transition: box-shadow 0.2s; }
        .stage-inner-canvas {
            position: absolute; top: 0; left: 0; width: 2816px; height: 1536px; transform-origin: top left;
        }
        .stage-inner-canvas img { position: absolute; top: 0; left: 0; pointer-events: none; }
        .layer-bg { z-index: 1; }
        .stage-inner-canvas img.equipped-item { pointer-events: auto; cursor: grab; }
        .stage-inner-canvas img.equipped-item:active { cursor: grabbing; }
        .stage-outer.drag-over .drop-overlay { opacity: 1; }
        .drop-overlay {
            position: absolute; inset: 0; background: rgba(231, 76, 60, 0.15); display: flex;
            align-items: center; justify-content: center; font-weight: bold; color: var(--highlight-color);
            font-size: 1.5rem; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 100;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .dressup-carousels { padding: 20px; background: #fff; border-top: 1px solid #e1e4e8; display: flex; flex-direction: column; gap: 15px; }
        .carousel-row { display: flex; align-items: center; gap: 10px; }
        .carousel-title { min-width: 110px; font-size: 0.85rem; font-weight: 700; text-transform: uppercase; color: #7f8c8d; text-align: right; }
        .carousel-row.is-next .carousel-title { color: var(--highlight-color); }
        .carousel-row.is-next .carousel-track { border-color: rgba(231, 76, 60, 0.3); background: rgba(231, 76, 60, 0.02); }
        .carousel-track { display: flex; flex: 1; gap: 10px; overflow-x: auto; padding: 10px; border: 1px solid transparent; border-radius: var(--border-radius); scrollbar-width: thin; scroll-snap-type: x mandatory; }
        .item-thumbnail {
            width: 70px; height: 70px; flex-shrink: 0; background: #f1f2f6; border: 2px solid #dcdde1; border-radius: 8px; cursor: grab;
            scroll-snap-align: start; display: flex; align-items: center; justify-content: center; overflow: hidden; touch-action: pan-x;
        }
        .item-thumbnail:active { cursor: grabbing; }
        .item-thumbnail.is-equipped { opacity: 0.4; filter: grayscale(100%); }
        .item-thumbnail img { width: 100%; height: 100%; object-fit: contain; transform: scale(3.5); pointer-events: none; }
        .drag-clone {
            position: fixed; width: 120px; height: 120px; object-fit: contain; pointer-events: none; z-index: 99999;
            transform: translate(-50%, -50%); filter: drop-shadow(0 15px 25px rgba(0,0,0,0.4)); opacity: 0.95;
        }
        @media (max-width: 768px) {
            .dressup-controls { justify-content: flex-start; }
            .btn-reset { margin-left: 0; width: 100%; justify-content: center; }
            .carousel-row { flex-direction: column; align-items: flex-start; gap: 5px; }
            .carousel-title { text-align: left; }
        }
    </style>
    <div id="regional-dressup-widget" class="dressup-container">
        <header class="dressup-controls">
            <div class="control-group">
                <label for="gender-select">Género:</label>
                <select id="gender-select">
                    <option value="mujer" selected>Mujer</option>
                    <option value="hombre">Hombre</option>
                </select>
            </div>
            <div class="control-group">
                <label for="region-select">Grupo Regional:</label>
                <select id="region-select">
                    <option value="all" selected>Todos los grupos</option>
                </select>
            </div>
            <button id="reset-btn" class="btn-reset" title="Limpiar vestimenta">
                Reset
            </button>
        </header>
        <main class="dressup-stage">
            <div class="stage-outer" id="drop-zone">
                <div class="stage-inner-canvas" id="canvas-2816">
                    <img id="mannequin-bg" src="" alt="Maniquí" class="layer-bg">
                    <div id="clothes-layers"></div>
                </div>
                <div class="drop-overlay" id="drop-overlay">Suelta la prenda / Arrastra fuera para quitarla</div>
            </div>
        </main>
        <footer class="dressup-carousels" id="carousels-container">
        </footer>
    </div>
</div>
<script>
    var baseUrl = 'https://raw.githubusercontent.com/ahorrillo/juego-prendas-regionales/refs/heads/main/img/';
    var regions = [
        { id: 'badajoz-gala', name: 'Badajoz - Gala' }
    ];
    var genders = {
        mujer: {
            bg: 'maniqui-mujer.png',
            types: [
                { id: 'medias', label: 'Medias', zIndex: 2 },
                { id: 'camisa', label: 'Camisa', zIndex: 3 },
                { id: 'falda', label: 'Falda', zIndex: 4 },
                { id: 'zapatos', label: 'Zapatos', zIndex: 5 },
                { id: 'complementos', label: 'Complementos', zIndex: 6 },
                { id: 'cabeza', label: 'Cabeza', zIndex: 7 },
                { id: 'accesorio', label: 'Accesorio', zIndex: 8 }
            ]
        },
        hombre: {
            bg: 'maniqui-hombre.png',
            types: [
                { id: 'pantalon', label: 'Pantalón', zIndex: 2 },
                { id: 'camisa', label: 'Camisa', zIndex: 3 },
                { id: 'faja', label: 'Faja', zIndex: 4 },
                { id: 'zapatos', label: 'Zapatos', zIndex: 5 },
                { id: 'accesorio', label: 'Accesorio', zIndex: 6 }
            ]
        }
    };
    var state = { gender: 'mujer', region: 'all', equipped: {} };
    var thumbDrag = null;
    var canvasDrag = null;
    var widgetContainer = document.getElementById('regional-dressup-widget');
    var genderSel = document.getElementById('gender-select');
    var regionSel = document.getElementById('region-select');
    var resetBtn = document.getElementById('reset-btn');
    var mannequinBg = document.getElementById('mannequin-bg');
    var clothesLayers = document.getElementById('clothes-layers');
    var carouselsContainer = document.getElementById('carousels-container');
    var stageOuter = document.getElementById('drop-zone');
    var canvas2816 = document.getElementById('canvas-2816');
    if (widgetContainer) {
        for (var i = 0; i < regions.length; i++) {
            var opt = document.createElement('option');
            opt.value = regions[i].id;
            opt.textContent = regions[i].name;
            regionSel.appendChild(opt);
        }
        genderSel.addEventListener('change', function(e) {
            state.gender = e.target.value;
            state.equipped = {};
            renderApp();
        });
        regionSel.addEventListener('change', function(e) {
            state.region = e.target.value;
            renderCarousels();
        });

        resetBtn.addEventListener('click', function() {
            state.equipped = {};
            renderApp();
        });
        function updateCanvasScale() {
            var availableWidth = stageOuter.clientWidth;
            var ratio = availableWidth / 2816;
            canvas2816.style.transform = 'scale(' + ratio + ')';
            stageOuter.style.height = (1536 * ratio) + 'px';
        }
        window.addEventListener('resize', updateCanvasScale);
        function renderApp() {
            mannequinBg.src = baseUrl + genders[state.gender].bg;
            renderEquippedClothes();
            renderCarousels();
        }
        function renderCarousels() {
            carouselsContainer.innerHTML = '';
            var types = genders[state.gender].types;
            for (var i = 0; i < types.length; i++) {
                var typeDef = types[i];
                var row = document.createElement('div');
                row.className = 'carousel-row';
                var title = document.createElement('div');
                title.className = 'carousel-title';
                title.textContent = typeDef.label;
                var track = document.createElement('div');
                track.className = 'carousel-track';
                var regionsToShow = state.region === 'all' ? regions.map(function(r){return r.id}) : [state.region];
                for (var j = 0; j < regionsToShow.length; j++) {
                    track.appendChild(buildThumbnail(typeDef, regionsToShow[j]));
                }
                row.appendChild(title);
                row.appendChild(track);
                carouselsContainer.appendChild(row);
            }
        }
        function buildThumbnail(typeDef, regionId) {
            var el = document.createElement('div');
            el.className = 'item-thumbnail';
            if (state.equipped[typeDef.id] && state.equipped[typeDef.id].regionId === regionId) {
                el.classList.add('is-equipped');
            }
            var imgUrl = baseUrl + regionId + '-' + state.gender + '-' + typeDef.id + '.png';
            el.innerHTML = '<img src="' + imgUrl + '" alt="' + typeDef.label + '">';
            el.addEventListener('pointerdown', function(e) {
                if (e.pointerType === 'mouse' && e.button !== 0) return;
                e.preventDefault();
                startThumbDrag(e, typeDef.id, regionId, imgUrl);
            });
            return el;
        }
        function renderEquippedClothes() {
            clothesLayers.innerHTML = '';
            var types = genders[state.gender].types;
            for (var i = 0; i < types.length; i++) {
                var typeDef = types[i];
                var itemData = state.equipped[typeDef.id];
                if (itemData) {
                    var img = document.createElement('img');
                    img.src = baseUrl + itemData.regionId + '-' + state.gender + '-' + typeDef.id + '.png';
                    img.style.zIndex = typeDef.zIndex;
                    img.alt = typeDef.label;
                    img.className = 'equipped-item';
                    img.style.left = itemData.x + 'px';
                    img.style.top = itemData.y + 'px';
                    (function(currentTypeDef, currentItemData, currentImg) {
                        currentImg.addEventListener('pointerdown', function(e) {
                            if (e.pointerType === 'mouse' && e.button !== 0) return;
                            e.preventDefault();
                            e.stopPropagation();
                            var scale = stageOuter.clientWidth / 2816;
                            canvasDrag = {
                                typeId: currentTypeDef.id,
                                img: currentImg,
                                startX: e.clientX,
                                startY: e.clientY,
                                initialX: currentItemData.x,
                                initialY: currentItemData.y,
                                scale: scale,
                                isDragging: false
                            };
                            document.body.classList.add('is-dressing-up');
                            document.addEventListener('pointermove', onCanvasMove);
                            document.addEventListener('pointerup', onCanvasUp);
                        });
                    })(typeDef, itemData, img);
                    clothesLayers.appendChild(img);
                }
            }
        }
        function startThumbDrag(e, typeId, regionId, imgUrl) {
            var clone = document.createElement('img');
            clone.src = imgUrl;
            clone.className = 'drag-clone';
            thumbDrag = {
                typeId: typeId, regionId: regionId, clone: clone,
                startX: e.clientX, startY: e.clientY,
                isDragging: false
            };
            document.body.classList.add('is-dressing-up');
            document.addEventListener('pointermove', onThumbMove);
            document.addEventListener('pointerup', onThumbUp);
        }
        function onThumbMove(e) {
            if (!thumbDrag) return;
            if (!thumbDrag.isDragging) {
                var dx = Math.abs(e.clientX - thumbDrag.startX);
                var dy = Math.abs(e.clientY - thumbDrag.startY);
                if (dx > 5 || dy > 5) {
                    thumbDrag.isDragging = true;
                    document.body.appendChild(thumbDrag.clone);
                }
            }
            if (thumbDrag.isDragging) {
                thumbDrag.clone.style.left = e.clientX + 'px';
                thumbDrag.clone.style.top = e.clientY + 'px';
                var rect = stageOuter.getBoundingClientRect();
                if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
                    stageOuter.classList.add('drag-over');
                } else {
                    stageOuter.classList.remove('drag-over');
                }
            }
        }
        function onThumbUp(e) {
            if (!thumbDrag) return;
            var rect = stageOuter.getBoundingClientRect();
            var isInside = (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom);
            if (!thumbDrag.isDragging) {
                if (state.equipped[thumbDrag.typeId] && state.equipped[thumbDrag.typeId].regionId === thumbDrag.regionId) {
                    delete state.equipped[thumbDrag.typeId];
                } else {
                    state.equipped[thumbDrag.typeId] = { regionId: thumbDrag.regionId, x: 0, y: 0 };
                }
            } else {
                if (isInside) {
                    state.equipped[thumbDrag.typeId] = { regionId: thumbDrag.regionId, x: 0, y: 0 };
                }
            }
            renderEquippedClothes();
            renderCarousels();
            if (thumbDrag.clone.parentNode) thumbDrag.clone.remove();
            stageOuter.classList.remove('drag-over');
            document.body.classList.remove('is-dressing-up');
            document.removeEventListener('pointermove', onThumbMove);
            document.removeEventListener('pointerup', onThumbUp);
            thumbDrag = null;
        }
        function onCanvasMove(e) {
            if (!canvasDrag) return;
            if (!canvasDrag.isDragging) {
                var dx = Math.abs(e.clientX - canvasDrag.startX);
                var dy = Math.abs(e.clientY - canvasDrag.startY);
                if (dx > 3 || dy > 3) {
                    canvasDrag.isDragging = true;
                    canvasDrag.img.style.zIndex = 999;
                }
            }
            if (canvasDrag.isDragging) {
                var deltaX = (e.clientX - canvasDrag.startX) / canvasDrag.scale;
                var deltaY = (e.clientY - canvasDrag.startY) / canvasDrag.scale;
                canvasDrag.img.style.left = (canvasDrag.initialX + deltaX) + 'px';
                canvasDrag.img.style.top = (canvasDrag.initialY + deltaY) + 'px';
                var rect = stageOuter.getBoundingClientRect();
                if (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom) {
                    stageOuter.classList.add('drag-over');
                } else {
                    stageOuter.classList.remove('drag-over');
                }
            }
        }
        function onCanvasUp(e) {
            if (!canvasDrag) return;
            if (canvasDrag.isDragging) {
                var rect = stageOuter.getBoundingClientRect();
                var isInside = (e.clientX >= rect.left && e.clientX <= rect.right && e.clientY >= rect.top && e.clientY <= rect.bottom);
                if (isInside) {
                    var deltaX = (e.clientX - canvasDrag.startX) / canvasDrag.scale;
                    var deltaY = (e.clientY - canvasDrag.startY) / canvasDrag.scale;
                    state.equipped[canvasDrag.typeId].x = canvasDrag.initialX + deltaX;
                    state.equipped[canvasDrag.typeId].y = canvasDrag.initialY + deltaY;
                } else {
                    delete state.equipped[canvasDrag.typeId];
                }
            }
            stageOuter.classList.remove('drag-over');
            document.body.classList.remove('is-dressing-up');
            document.removeEventListener('pointermove', onCanvasMove);
            document.removeEventListener('pointerup', onCanvasUp);
            canvasDrag = null;
            renderEquippedClothes();
            renderCarousels();
        }
        updateCanvasScale();
        renderApp();
    }
</script>
